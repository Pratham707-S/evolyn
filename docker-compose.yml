services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: evolyn-postgres
    restart: always
    environment:
      POSTGRES_USER: evolyn
      POSTGRES_PASSWORD: evolyn_secret
      POSTGRES_DB: evolyn_db
    ports:
      - "5432:5432"
    volumes:
      - evolyn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolyn -d evolyn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  evolyn_pgdata:
    name: evolyn_pgdata
